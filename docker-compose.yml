version: '3.8'

services:
  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    container_name: codesense-ml-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - codesense-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codesense-api
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - API_PORT=5001
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MONGODB_URI=${MONGODB_URI}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-codesense-production-secret-key-min-32-chars}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/api/health', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - codesense-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
    container_name: codesense-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - codesense-network

networks:
  codesense-network:
    driver: bridge
